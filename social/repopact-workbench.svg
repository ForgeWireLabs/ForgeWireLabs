<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">RepoPact Workbench — native interface for repository governance</title><desc id="desc">A native Workbench interface helps people explore repository records and review supported changes while Core remains authoritative.</desc>
