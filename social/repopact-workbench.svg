<g font-family="Segoe UI,Roboto,Arial,sans-serif"><rect x="88" y="96" width="6" height="48" rx="3" fill="url(#accent)"/><text x="118" y="126" fill="#a8c1ce" font-size="18" font-weight="700" letter-spacing="4">THE NATIVE INTERFACE</text><text x="88" y="250" fill="#f4f7fa" font-size="49" font-weight="750">RepoPact Workbench</text><text x="92" y="315" fill="#c7d4de" font-size="22">Explore repository records. Review supported changes.</text><text x="92" y="370" fill="#8ad5c4" font-size="19" font-weight="650">A visual workspace around Core's semantics.</text><path d="M92 450h430" stroke="#3a5266" stroke-width="2"/><text x="92" y="484" fill="#a8c1ce" font-size="14" font-weight="600" letter-spacing="2">SOURCE-BUILD PREVIEW · SEPARATE PRODUCT AND VERSION</text></g></svg>
